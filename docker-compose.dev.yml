# Local services for the Database app: postgres, MinIO (S3), Mailpit (SMTP).
# Usage: docker compose -f docker-compose.dev.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: database
      POSTGRES_DB: database_app
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: local
      MINIO_ROOT_PASSWORD: localsecret
    ports: ["9000:9000", "9001:9001"]   # console: http://localhost:9001
    volumes: [miniodata:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 local localsecret; do sleep 1; done;
      mc mb -p local/database-files || true;
      exit 0;"

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]   # UI: http://localhost:8025

volumes:
  dbdata:
  miniodata:
