# Local services for Vault: postgres and Mailpit (SMTP).
# Usage: docker compose -f docker-compose.dev.yml up -d
#
# There is no object-storage service: uploads are written to the `storage/` directory
# in the project, not to a bucket. See docs/FILE-STORAGE.md.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: database
      POSTGRES_DB: database_app
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]   # UI: http://localhost:8025

volumes:
  dbdata:
