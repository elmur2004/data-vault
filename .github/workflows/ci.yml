name: CI

# Every push is verified against real services, not mocks — the invariants this app
# exists for (the 422 completion gate, 403 scoping, signed URLs, content inspection)
# are only meaningful against a real Postgres and a real S3.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    # Postgres and Mailpit both run correctly on their image's default command, so they
    # can be service containers. MinIO cannot: its entrypoint needs `server /data`, and
    # service containers have no way to pass a command — which is why it is started as
    # a step below instead.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: database
          POSTGRES_DB: database_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mailpit:
        image: axllent/mailpit:latest
        ports: ["1025:1025", "8025:8025"]

    env:
      DATABASE_URL: postgresql://postgres:database@127.0.0.1:5432/database_app?schema=public
      APP_URL: http://localhost:3001
      BETTER_AUTH_URL: http://localhost:3001
      BETTER_AUTH_SECRET: ci-secret-not-used-anywhere-else-000000
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: auto
      S3_BUCKET: database-files
      S3_ACCESS_KEY_ID: local
      S3_SECRET_ACCESS_KEY: localsecret
      S3_FORCE_PATH_STYLE: "true"
      SIGNED_URL_TTL_SECONDS: "300"
      MAX_UPLOAD_MB: "25"
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: "1025"
      SMTP_FROM: Vault <no-reply@local.test>
      DISPLAY_TZ: Africa/Cairo
      MALWARE_SCAN: "off"
      SEED_ADMIN_EMAIL: admin@byteforce.com
      SEED_ADMIN_PASSWORD: password123
      CRON_SECRET: ci-cron-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=local \
            -e MINIO_ROOT_PASSWORD=localsecret \
            minio/minio:latest server /data
          for i in $(seq 1 40); do
            if curl -sf http://127.0.0.1:9000/minio/health/live > /dev/null; then
              echo "minio is up"; exit 0
            fi
            sleep 2
          done
          echo "minio did not become healthy"; docker logs minio; exit 1

      - name: Install
        run: npm ci --no-audit --no-fund

      # The same routine developers run locally. If it cannot heal a clean checkout,
      # neither can anybody who pulls this commit.
      - name: Heal (env, migrations, bucket, admin)
        run: npm run doctor

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      # Started before the tests, because the direct-API negatives (AC-08 422,
      # AC-13/AC-14 403) are sent over HTTP at a running server.
      - name: Start the app
        run: |
          npm run start > /tmp/app.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3001/login > /dev/null; then
              echo "app is up"; exit 0
            fi
            sleep 2
          done
          echo "app did not start within 120s"; cat /tmp/app.log; exit 1

      - name: Tests — unit, integration and the direct-API negatives
        run: npm test

      - name: Acceptance — browser criteria
        run: |
          npx playwright install --with-deps chromium
          npx tsx scripts/checks/acceptance.ts

      - name: App log
        if: failure()
        run: cat /tmp/app.log || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-evidence
          path: evidence/
          if-no-files-found: ignore
          retention-days: 14
